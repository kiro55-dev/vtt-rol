<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prueba WebRTC</title>
<style>
  :root { color-scheme: dark; --fondo: #18181b; --panel: #27272a; --texto: #e4e4e7; --tenue: #a1a1aa; --ok: #4ade80; --mal: #f87171; }
  body { margin: 0; padding: 16px; background: var(--fondo); color: var(--texto); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--tenue); margin: 0 0 12px; }
  button { background: #3f3f46; color: var(--texto); border: 1px solid #52525b; border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; margin: 0 6px 6px 0; }
  button:hover:not(:disabled) { background: #52525b; }
  button:disabled { opacity: .5; cursor: default; }
  textarea { width: 100%; box-sizing: border-box; height: 90px; background: var(--panel); color: var(--texto); border: 1px solid #3f3f46; border-radius: 6px; font: 12px monospace; padding: 6px; }
  #manual { display: none; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; }
  td { padding: 4px 6px; border-bottom: 1px solid #3f3f46; vertical-align: top; }
  td:first-child { color: var(--tenue); width: 40%; }
  .ok { color: var(--ok); } .mal { color: var(--mal); }
  pre { background: var(--panel); padding: 8px; border-radius: 6px; max-height: 180px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>Prueba WebRTC (fase 0)</h1>
  <p>Conecta este navegador con el servidor de prueba del host y mide latencia, pérdidas y velocidad.</p>
  <button id="local">Conectar (mismo PC)</button>
  <button id="btnManual">Modo manual (otra red)</button>
  <button id="copiar" disabled>Copiar resultados</button>
  <div id="manual">
    <p>1. Copia este código y pégalo en la consola del host (<code>--manual</code>):</p>
    <textarea id="oferta" readonly></textarea>
    <p>2. Pega aquí la respuesta que imprime el host:</p>
    <textarea id="respuesta"></textarea>
    <button id="usar">Usar respuesta</button>
  </div>
  <table id="tabla"></table>
  <pre id="log"></pre>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const res = { navegador: navigator.userAgent, plataforma: navigator.platform, fecha: new Date().toISOString() };
let pc, juego, arrastre;

function log(t) { $("log").textContent += t + "\n"; }
function fila(nombre, valor, clase) {
  const tr = document.createElement("tr");
  const a = document.createElement("td"); a.textContent = nombre;
  const b = document.createElement("td"); b.textContent = valor; if (clase) b.className = clase;
  tr.append(a, b); $("tabla").append(tr);
}
const ms = (v) => `${v.toFixed(1)} ms`;
function resumen(v) {
  if (!v.length) return null;
  const o = [...v].sort((a, b) => a - b);
  const p = (q) => o[Math.min(o.length - 1, Math.floor(o.length * q))];
  return { min: o[0], mediana: p(0.5), p95: p(0.95), max: o[o.length - 1] };
}
const textoResumen = (r) => (r ? `mín ${ms(r.min)} · mediana ${ms(r.mediana)} · p95 ${ms(r.p95)} · máx ${ms(r.max)}` : "sin datos");
const espera = (ms) => new Promise((r) => setTimeout(r, ms));
const norm = (h) => (h || "").replace(/:/g, "").toUpperCase();

// Cada canal tiene un único receptor; las pruebas lo cambian según lo que esperan
const receptores = new Map();
function engancharReceptor(canal) {
  canal.binaryType = "arraybuffer";
  canal.onmessage = (e) => receptores.get(canal)?.(e.data);
}

function esperarIce(ms) {
  return new Promise((ok) => {
    if (pc.iceGatheringState === "complete") return ok();
    const t = setTimeout(ok, ms);
    pc.addEventListener("icegatheringstatechange", () => {
      if (pc.iceGatheringState === "complete") { clearTimeout(t); ok(); }
    });
  });
}

async function crearOferta() {
  pc = new RTCPeerConnection({ iceServers: [{ urls: ["stun:stun.l.google.com:19302", "stun:stun.cloudflare.com:3478"] }] });
  pc.onconnectionstatechange = () => log(`conexión: ${pc.connectionState}`);
  juego = pc.createDataChannel("juego");
  arrastre = pc.createDataChannel("arrastre", { ordered: false, maxRetransmits: 0 });
  engancharReceptor(juego);
  engancharReceptor(arrastre);
  const t0 = performance.now();
  await pc.setLocalDescription(await pc.createOffer());
  await esperarIce(3000); // sin trickle: como mucho 3 s
  res.reunirCandidatosMs = performance.now() - t0;
  res.candidatosPropios = [...pc.localDescription.sdp.matchAll(/typ (\w+)/g)].map((m) => m[1]);
  log(`candidatos propios: ${res.candidatosPropios.join(", ") || "ninguno"}`);
  return pc.localDescription;
}

function abierto(canal) {
  return new Promise((ok, mal) => {
    if (canal.readyState === "open") return ok();
    const t = setTimeout(() => mal("el canal no se abrió en 20 s"), 20000);
    canal.addEventListener("open", () => { clearTimeout(t); ok(); });
  });
}

async function parElegido() {
  const stats = await pc.getStats();
  let par;
  stats.forEach((s) => {
    if (s.type === "transport" && s.selectedCandidatePairId) par = stats.get(s.selectedCandidatePairId);
  });
  if (!par) stats.forEach((s) => { if (s.type === "candidate-pair" && s.nominated && s.state === "succeeded") par = s; });
  if (!par) return null;
  const l = stats.get(par.localCandidateId), r = stats.get(par.remoteCandidateId);
  return { local: l?.candidateType, remoto: r?.candidateType, protocolo: l?.protocol, rttStunMs: par.currentRoundTripTime != null ? par.currentRoundTripTime * 1000 : null };
}

/** Manda `n` mensajes de 200 B de uno en uno y mide la vuelta. En un canal sin reintentos, uno perdido cuenta tras 1 s. */
async function latencia(canal, n) {
  const tiempos = [];
  let perdidos = 0;
  for (let i = 0; i < n; i++) {
    const id = `L${i}:`.padEnd(200, ".");
    const t0 = performance.now();
    const ok = await new Promise((fin) => {
      const t = setTimeout(() => fin(false), 1000);
      receptores.set(canal, (d) => { if (d === id) { clearTimeout(t); fin(true); } });
      canal.send(id);
    });
    if (ok) tiempos.push(performance.now() - t0); else perdidos++;
  }
  return { ...resumen(tiempos), perdidos };
}

/** Como el arrastre de fichas: 20 mensajes/s durante 10 s, sin esperar a la vuelta. */
async function arrastreSimulado(canal) {
  const salida = new Map();
  const tiempos = [];
  receptores.set(canal, (d) => {
    const t = salida.get(d);
    if (t !== undefined) { tiempos.push(performance.now() - t); salida.delete(d); }
  });
  for (let i = 0; i < 200; i++) {
    const msg = `A${i}:`.padEnd(300, "x");
    salida.set(msg, performance.now());
    canal.send(msg);
    await espera(50);
  }
  await espera(1500);
  return { ...resumen(tiempos), enviados: 200, devueltos: tiempos.length, perdidosPct: ((200 - tiempos.length) / 2) };
}

async function bajada(bytes) {
  let recibidos = 0;
  const t0 = performance.now();
  await new Promise((fin, mal) => {
    const t = setTimeout(() => mal(`bajada incompleta: ${recibidos} de ${bytes}`), 120000);
    receptores.set(juego, (d) => {
      if (d instanceof ArrayBuffer) recibidos += d.byteLength;
      if (recibidos >= bytes) { clearTimeout(t); fin(); }
    });
    juego.send(`TAM ${bytes}`);
  });
  const s = (performance.now() - t0) / 1000;
  return { bytes, segundos: s, MBps: bytes / 1048576 / s, Mbitps: (bytes * 8) / 1e6 / s };
}

async function subida(bytes) {
  const trozo = new Uint8Array(16 * 1024);
  juego.bufferedAmountLowThreshold = 256 * 1024;
  const t0 = performance.now();
  for (let enviado = 0; enviado < bytes; enviado += trozo.length) {
    if (juego.bufferedAmount > 1024 * 1024) {
      await new Promise((ok) => juego.addEventListener("bufferedamountlow", ok, { once: true }));
    }
    juego.send(trozo);
  }
  const cuenta = await new Promise((fin, mal) => {
    const t = setTimeout(() => mal("el host no contestó la cuenta"), 120000);
    receptores.set(juego, (d) => { if (typeof d === "string" && d.startsWith("RECIBIDOS")) { clearTimeout(t); fin(Number(d.split(" ")[1])); } });
    juego.send("CUENTA");
  });
  const s = (performance.now() - t0) / 1000;
  return { bytes, recibidosHost: cuenta, segundos: s, MBps: bytes / 1048576 / s, Mbitps: (bytes * 8) / 1e6 / s };
}

/** ¿Qué tamaño de mensaje aguanta? (al final: uno demasiado grande puede romper el canal) */
async function tamanos() {
  const out = { maxMessageSizeNavegador: pc.sctp?.maxMessageSize ?? null, pruebas: {} };
  for (const n of [16 * 1024, 64 * 1024, 256 * 1024]) {
    const msg = "T".repeat(n);
    try {
      const vuelto = await new Promise((fin) => {
        const t = setTimeout(() => fin(false), 3000);
        receptores.set(juego, (d) => { if (d === msg) { clearTimeout(t); fin(true); } });
        juego.send(msg);
      });
      out.pruebas[n] = vuelto ? "vuelve" : "no vuelve";
    } catch (e) {
      out.pruebas[n] = `el navegador no lo envía (${e.name})`;
    }
    if (juego.readyState !== "open") { out.pruebas[n] += " · el canal se cerró"; break; }
  }
  return out;
}

async function conectarConRespuesta(respuesta, huellaHost) {
  const fp = /a=fingerprint:sha-256 ([0-9A-Fa-f:]+)/.exec(respuesta.sdp)?.[1];
  res.huellaRespuesta = fp ? fp.toUpperCase() : null;
  if (huellaHost) res.huellaCoincide = norm(fp) === norm(huellaHost);
  res.candidatosHost = [...respuesta.sdp.matchAll(/typ (\w+)/g)].map((m) => m[1]);
  const t0 = performance.now();
  await pc.setRemoteDescription(respuesta);
  await abierto(juego);
  await abierto(arrastre);
  res.conectarMs = performance.now() - t0;
  res.par = await parElegido();
  mostrarConexion();
  await pruebas();
}

function mostrarConexion() {
  $("tabla").innerHTML = "";
  if (res.libreria) fila("Librería del host", res.libreria);
  fila("Reunir candidatos", ms(res.reunirCandidatosMs));
  fila("Conectar (tras la respuesta)", ms(res.conectarMs));
  if (res.par) fila("Camino elegido", `${res.par.local} → ${res.par.remoto} (${res.par.protocolo})${res.par.rttStunMs != null ? ` · RTT STUN ${ms(res.par.rttStunMs)}` : ""}`);
  if ("huellaCoincide" in res) fila("Huella del host", res.huellaCoincide ? "coincide" : "NO coincide", res.huellaCoincide ? "ok" : "mal");
  else fila("Huella de la respuesta (compárala con la consola)", res.huellaRespuesta ?? "sin huella");
}

async function pruebas() {
  log("midiendo latencia…");
  res.latenciaJuego = await latencia(juego, 200);
  fila("Latencia «juego» (fiable)", textoResumen(res.latenciaJuego) + ` · perdidos ${res.latenciaJuego.perdidos}`);
  res.latenciaArrastre = await latencia(arrastre, 200);
  fila("Latencia «arrastre» (sin reintentos)", textoResumen(res.latenciaArrastre) + ` · perdidos ${res.latenciaArrastre.perdidos}`);
  log("simulando arrastre…");
  res.arrastre = await arrastreSimulado(arrastre);
  fila("Arrastre 20/s × 10 s", `${res.arrastre.devueltos}/200 devueltos (${res.arrastre.perdidosPct} % perdidos) · ${textoResumen(res.arrastre)}`, res.arrastre.perdidosPct > 5 ? "mal" : "ok");
  log("midiendo velocidad…");
  try {
    res.bajada = await bajada(20 * 1048576);
    fila("Bajada 20 MB (host → navegador)", `${res.bajada.MBps.toFixed(2)} MB/s (${res.bajada.Mbitps.toFixed(1)} Mbit/s)`);
  } catch (e) { res.bajada = String(e); fila("Bajada", String(e), "mal"); }
  try {
    res.subida = await subida(10 * 1048576);
    fila("Subida 10 MB (navegador → host)", `${res.subida.MBps.toFixed(2)} MB/s (${res.subida.Mbitps.toFixed(1)} Mbit/s)${res.subida.recibidosHost === res.subida.bytes ? "" : " · ¡el host contó " + res.subida.recibidosHost + "!"}`);
  } catch (e) { res.subida = String(e); fila("Subida", String(e), "mal"); }
  log("probando tamaños de mensaje…");
  res.tamanos = await tamanos();
  fila("Tamaño máximo (navegador)", String(res.tamanos.maxMessageSizeNavegador));
  for (const [n, r] of Object.entries(res.tamanos.pruebas)) fila(`Mensaje de ${n / 1024} KiB`, r, r === "vuelve" ? "ok" : "mal");
  log("terminado");
  $("copiar").disabled = false;
}

function fallo(e) { log("ERROR: " + e); fila("Error", String(e), "mal"); }

$("local").onclick = async () => {
  $("local").disabled = $("btnManual").disabled = true;
  try {
    res.modo = "local";
    res.libreria = await (await fetch("/info")).text();
    const huella = await (await fetch("/huella")).text();
    const oferta = await crearOferta();
    const r = await fetch("/oferta", { method: "POST", body: JSON.stringify(oferta) });
    if (!r.ok) throw await r.text();
    await conectarConRespuesta(await r.json(), huella);
  } catch (e) { fallo(e); }
};

const aBase64 = (t) => btoa(String.fromCharCode(...new TextEncoder().encode(t)));
const deBase64 = (b) => new TextDecoder().decode(Uint8Array.from(atob(b.trim()), (c) => c.charCodeAt(0)));

$("btnManual").onclick = async () => {
  $("local").disabled = $("btnManual").disabled = true;
  $("manual").style.display = "block";
  res.modo = "manual";
  try {
    $("oferta").value = aBase64(JSON.stringify(await crearOferta()));
    $("oferta").select();
  } catch (e) { fallo(e); }
};

$("usar").onclick = async () => {
  $("usar").disabled = true;
  try { await conectarConRespuesta(JSON.parse(deBase64($("respuesta").value)), null); } catch (e) { fallo(e); }
};

$("copiar").onclick = async () => {
  const json = JSON.stringify(res, null, 2);
  try { await navigator.clipboard.writeText(json); log("resultados copiados"); }
  catch { log(json); log("(no se pudo copiar: selecciona el texto de arriba)"); }
};
</script>
</body>
</html>
