# Publica la app para los JUGADORES en GitHub Pages: https://kiro55-dev.github.io/OpenRoll/
# Es la misma app que la del host (src/), compilada para el navegador (`bun run web:build`, OPENROLL_WEB=1):
# sin Tauri, sus datos llegan del host por la sala (ver docs/red.md). Los enlaces de las salas apuntan aquí.
# Se publica sola al subir cambios del front; también se puede lanzar a mano.
name: App de los jugadores (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "static/**"
      - "svelte.config.js"
      - "vite.config.js"
      - "package.json"
      - "bun.lock"
      - "src-tauri/Cargo.toml" # su versión va en version.json
      - "src-tauri/tauri.conf.json"
      - ".github/workflows/cliente-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run
      - run: bun run web:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-web

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@v4
